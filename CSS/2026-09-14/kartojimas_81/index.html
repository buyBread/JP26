<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Kartojimas 81</title>
</head>
<body>
    <div class="row-display">
        <div class="image-container text-below" id="object-fit-fill">
            <img src="./img/kaunas.jpg"/>
            <p>fill</p>
        </div>
        <div class="image-container text-below" id="object-fit-cover">
            <img src="./img/kaunas.jpg"/>
            <p>cover</p>
        </div>
        <div class="image-container text-below" id="object-fit-contain">
            <img src="./img/kaunas.jpg"/>
            <p>contain</p>
        </div>
        <div class="image-container text-below" id="object-fit-none">
            <img src="./img/kaunas.jpg"/>
            <p>none</p>
        </div>
        <div class="image-container text-below" id="object-fit-scale-down">
            <img src="./img/kaunas.jpg"/>
            <p>scale-down</p>
        </div>
    </div>
    
    <div class="row-display">
        <div class="image-container text-inside" id="repeating">
            <div class="image-div"></div>
            <p>repeating</p>
        </div>
        <div class="image-container text-inside" id="multiple">
            <div class="image-div"></div>
            <p>multiple</p>
        </div>
        <div class="image-container text-inside" id="opacity">
            <div class="image-div"></div>
            <p>opacity</p>
        </div>
        <div class="image-container text-inside" id="positioned">
            <div class="image-div"></div>
            <p>positioned</p>
        </div>
        <div class="image-container text-inside" id="flat-color">
            <div class="image-div"></div>
            <p>flat-color</p>
        </div>
        <div class="image-container text-inside" id="image">
            <div class="image-div"></div>
            <p>image</p>
        </div>
        <div class="image-container text-inside" id="gradient">
            <div class="image-div"></div>
            <p>gradient</p>
        </div>
    </div>
</body>
</html>
