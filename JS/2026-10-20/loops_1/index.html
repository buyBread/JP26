<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loops 1</title>
</head>
<script>
    // 1
    for (const n of [11, 489, 3].values()) {
        console.log("1 -- " + n)
    }

    // 2.1
    let sum = 0;

    for (const n of [11, 489, 3].values()) {
        sum += n;
    }

    console.log("2.1 -- " + sum)

    // 2.2
    sum = [11, 489, 3].reduce((res, n) => res + n, 0);

    console.log("2.2 -- " + sum);

    // 2.3
    sum = 0;

    [11, 489, 3].forEach(n => sum += n);

    console.log("2.3 -- " + sum);

    // 3
    const sentence = "The quick brown fox jumps over the lazy dog for fun.";

    console.log("3 -- " + sentence);

    let sentence_even_words = sentence.split(" ").filter((_, i) => i % 2 == 0);
    let sentence_odd_words = sentence.split(" ").filter((_, i) => i % 2 != 0);

    sentence_even_words = sentence_even_words.join(" ");
    sentence_odd_words = sentence_odd_words.join(" ");

    console.log("3.1 -- " + sentence_even_words);
    console.log("3.2 -- " + sentence_odd_words);

    // 4
    let num_array = [14, 31, 9, 27, 58, 41, 93, 43, 11, 14, 19, 11, 421, 94];

    console.log("4 (before) -- " + num_array)

    let smallest_index = num_array.findIndex((n) => n == Math.min(...num_array));

    num_array.splice(smallest_index + 1, 3)

    console.log("4 (after) -- " + num_array)
</script>
<body>
    <h1>zzz</h1>
</body>
</html>
