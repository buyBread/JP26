<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Kartojimas 40</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top py-0"><div class="container-fluid px-0">
        <a class="navbar-brand mx-4" href="#">Mokomės</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active bg-body p-3" href="#">Pagrindinis</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled p-3" href="#">Galerija</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link p-3">Kontaktai</a>
                </li>
            </ul>
            <form class="d-flex mx-3" role="search">
                <input class="form-control me-2" type="search" placeholder="...veskite žodį..."/>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </div></nav>

    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-12 col-lg-6">
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">Jūsų paštas</label>
                        <input type="email" class="form-control" id="email">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Jūsų vardas</label>
                        <input type="text" class="form-control" id="name">
                    </div>
                    <div class="mb-3">
                        <select class="form-select">
                            <option selected>Pasirinkite miestą</option>
                            <option value="1">Vilnius</option>
                            <option value="2">Kaunas</option>
                            <option value="3">Klaipėda</option>
                        </select>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="newsletter">
                        <label class="form-check-label" for="newsletter">Noriu gauti naujienas</label>
                    </div>
                    <div class="mb-3">
                        <label for="question" class="form-label">Užduokite klausimą</label>
                        <textarea class="form-control" id="question" rows="4"></textarea>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="agreement">
                        <label class="form-check-label" for="agreement">Sutinku</label>
                    </div>
                    <button type="submit" class="btn btn-success">Siųsti</button>
                </form>
            </div>
            <div class="col-lg-6 d-none d-lg-flex justify-content-center align-items-center" >
                <img src="./img/tech-support.jpg" class="w-75 rounded-3" alt="Techninė pagalba">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
